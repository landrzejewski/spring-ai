spring:
  application:
    name: springai
  reactor:
    # przenosi kontekst obserwacji (trace) do operatorow Flux - bez tego spany streamingu trafiaja do osobnych trace'ow
    context-propagation: auto
  ai:
    ollama:
      chat:
        model: qwen3:0.6b
      init:
        pull-model-strategy: when_missing
        max-retries: 3
        chat:
          # sedzia bezpieczenstwa dla SafetyAdvisor i ModerationModel (pl.training.moderation)
          additional-models:
            - speakleash/bielik-11b-v2.3-instruct:Q4_K_M
      embedding:
        model: bge-m3
    openai:
#      api-key: ${OPENAI_KEY}
#      chat:
#        model: gpt-4.1
#        max-tokens: 4096
#        temperature: 0.1

      # Port 11435, a nie domyslne 11434, bo tam siedzi lokalna Ollama (zakladka Proxies w nvpair).
      # UWAGA: /v1 w base-url jest obowiazkowe. Spring AI 2.x opiera sie na SDK com.openai,
      # ktore dokleja samo /chat/completions - bez /v1 dostajemy 404 mimo dzialajacego serwera.
      base-url: ${PAIR_BASE_URL:http://127.0.0.1:11434/v1}
      api-key: ${PAIR_API_KEY:not-needed}
      chat:
        # Nazwy modeli z `curl http://127.0.0.1:11435/v1/models` (inwentarz calego klastra),
        # capabilities z `curl http://127.0.0.1:11435/api/tags`:
        #   gemma4:26b  - najwieksza jakosc, vision+audio+tools+thinking
        #   gemma4:12b  - kompromis jakosc/szybkosc, tools + thinking
        #   gemma4:e4b  - najszybszy z tools
        #   speakleash/bielik-minitron-7B-v3.0-instruct:Q4_K_M - PL, ma tools
        #   speakleash/bielik-11b-v2.3-instruct:Q4_K_M         - PL, BEZ tools (samo completion)
        model: ${LLM_MODEL:gemma4:12b}
        # bez tego gemma4 przepala budzet tokenow na rozumowanie i zwraca pusta tresc
        reasoning-effort: none
        max-tokens: 4096
        temperature: 0.2
      embedding:
        # bge-m3 -> 1024 wymiary, zgodne z istniejaca tabela vector_store
        model: ${LLM_EMBED_MODEL:bge-m3:latest}
    anthropic:
      # bez klucza endpointy /providers/anthropic/* zwracaja komunikat zamiast odpowiedzi
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_MODEL:claude-opus-5}
    chat:
      # obserwacje Spring AI (Micrometer) - tresc promptow/odpowiedzi tylko na potrzeby dev/szkolenia
      client:
        observations:
          log-prompt: true
          log-completion: true
      observations:
        log-prompt: true
        log-completion: true
        include-error-logging: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    tools:
      observations:
        include-content: true
      limits:
        max-calls-per-tool:
          DateTimeTool: 3
        max-total-tool-calls: 5
        on-limit-exceeded: return_error_response
    mcp:
      client:
#        stdio:
#          servers-configuration: classpath:mcp-servers-config.json
        streamable-http:
          connections:
#            mcp-server:
#              url: http://localhost:8090
#              endpoint: /mcp
            mcp-search:
              url: ${MCP_SEARCH_URL:https://mcp-search.klasawchmurze.pl}
              endpoint: /mcp
    vectorstore:
      observations:
        log-query-response: true
      pgvector:
        # dimensions: ${LLM_EMBED_DIM:768}
        # nomic-embed-text  -> 768
        # bge-m3            -> 1024
        # text-embedding-3-small (OpenAI) -> 1536
        initialize-schema: true
        # index-type: HNSW
        # distance-type: COSINE_DISTANCE

  datasource:
    url: jdbc:postgresql://localhost:5432/training
    username: admin
    password: admin
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  observations:
    key-values:
      application: springai
  tracing:
    sampling:
      probability: 1.0
  # eksport OTLP do kontenera grafana/otel-lgtm (docker-compose.yml)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    pl.training.springai.advisor: DEBUG
    io.modelcontextprotocol: DEBUG
mcp-search:
  token: ${MCP_SEARCH_TOKEN}