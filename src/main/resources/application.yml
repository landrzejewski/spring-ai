
spring:
  ai:
    openai:
      base-url: https://ai.klasawchmurze.pl
      api-key: ${LLM_API_KEY:sk-}
      chat:
        model: ${LLM_MODEL:ft-qwen3.6-35b-a3b}
        reasoning-effort: none
        max-tokens: 4096
        temperature: 0.2
      embedding:
        model: ${LLM_EMBED_MODEL:embed-bge-m3}
        # OpenAiEmbeddingModel embeds Document.getFormattedContent(metadataMode), and the default
        # EMBED mode prepends every metadata key - file name, page number, content_hash - to the
        # text. NONE embeds the text alone; the section title is already part of it.
        metadata-mode: NONE
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: spring_docs_vector_store
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  datasource:
    url: jdbc:postgresql://localhost:5432/training
    username: admin
    password: admin

app:
  rag:
    documents-location: classpath:documents/*.pdf
    # Every retrieved chunk (about one manual page) ends up in the prompt: fewer chunks give the
    # model too little to write a complete answer from, more start to add unrelated pages.
    top-k: 8
    similarity-threshold: 0.5
    chunk-size: 800
    max-history-messages: 10

logging:
  level:
    pl.training.springai: INFO
server:
  port: 9000
