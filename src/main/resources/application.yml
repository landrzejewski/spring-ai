spring:
  application:
    name: springai
  reactor:
    # przenosi kontekst obserwacji (trace) do operatorow Flux - bez tego spany streamingu trafiaja do osobnych trace'ow
    context-propagation: auto
  ai:
    ollama:
      chat:
        model: qwen3:0.6b
      init:
        pull-model-strategy: when_missing
        max-retries: 3
        chat:
          # sedzia bezpieczenstwa dla SafetyAdvisor i ModerationModel (pl.training.moderation)
          additional-models:
            - speakleash/bielik-11b-v2.3-instruct:Q4_K_M
      embedding:
        model: bge-m3
    openai:
#      api-key: ${OPENAI_KEY}
#      chat:
#        model: gpt-4.1
#        max-tokens: 4096
#        temperature: 0.1

      base-url: https://ai.klasawchmurze.pl
      api-key: ${LLM_API_KEY}
      chat:
      #  Nazwa w API	Model	Silnik	Kiedy
      #  qwen3.8-27b	Qwen3.8-27B UD-Q5_K_M	llama.cpp	gęsty, najlepsza jakość rozumowania i kodu, obraz
      #  gemma-4-31b	Gemma 4 31B QAT Q4_K_XL	llama.cpp	ogólny, obrazy, Apache 2.0
      #  glm-4.7-flash	GLM-4.7-Flash 30B-A3B Q5	llama.cpp	szybki MoE mieszczący się w VRAM; agenty, narzędzia, wyszukiwanie
      #  qwen3.6-35b-a3b	Qwen3.6-35B-A3B NVFP4	FreeToken	szybki MoE, obraz, 256k kontekstu
      #  qwen3.8-flash-next	Qwen3.8-Flash-Next 180B MoE NVFP4 (126 GB)	FreeToken	najnowszy Qwen, obraz, 256k; eksperci w RAM
      #  minimax-m2.7	MiniMax-M2.7 229B MoE NVFP4 (131 GB)	FreeToken	kod, agenci, tylko tekst; licencja niekomercyjna
      #  deepseek-v4-flash	DeepSeek-V4-Flash 291B MoE FP8 (156 GB)	FreeToken	rozumowanie, tylko tekst; eksperci zajmują prawie cały RAM
      #  qwen3.5-4b / qwen3.5-4b-q4	Qwen3.5-4B Q8 / Q4	llama.cpp	mały; najlepszy tool calling w swojej klasie, obraz (Q8); para do demo kwantyzacji
      #  qwen3.5-9b	Qwen3.5-9B Q4	llama.cpp	średni; myślenie, kod, obraz
      #  gemma-4-e2b	Gemma 4 E2B QAT Q4	llama.cpp	„klasa telefon” — pokaz granic małych modeli
      #  gemma-4-e4b	Gemma 4 E4B QAT Q4	llama.cpp	„klasa laptop”, obraz
      #  gemma-4-12b	Gemma 4 12B QAT Q4	llama.cpp	złoty środek, obraz
      #  qwen3.5-0.8b	Qwen3.5-0.8B Q8	llama.cpp	model zadaniowy Open WebUI (tytuły, pytania nawiązujące) — nie do czatu
      #  embed-qwen	Qwen3-Embedding-0.6B (1024 wym.)	llama.cpp	embeddingi; domyślny do RAG, dobry dla polskiego
      #  embed-qwen-4b	Qwen3-Embedding-4B Q8 (2560 wym.)	llama.cpp	mocniejsze embeddingi wielojęzyczne
      #  embed-bge-m3	bge-m3 Q8 (1024 wym., 8k kontekstu)	llama.cpp	długie chunki RAG
        model: qwen3.8-27b
        reasoning-effort: none
        max-tokens: 4096
        temperature: 0.2
      embedding:
        model: ${LLM_EMBED_MODEL:embed}
    anthropic:
      # bez klucza endpointy /providers/anthropic/* zwracaja komunikat zamiast odpowiedzi
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_MODEL:claude-opus-5}
    chat:
      # obserwacje Spring AI (Micrometer) - tresc promptow/odpowiedzi tylko na potrzeby dev/szkolenia
      client:
        observations:
          log-prompt: true
          log-completion: true
      observations:
        log-prompt: true
        log-completion: true
        include-error-logging: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    tools:
      observations:
        include-content: true
      limits:
        max-calls-per-tool:
          DateTimeTool: 3
        max-total-tool-calls: 5
        on-limit-exceeded: return_error_response
    mcp:
      client:
#        stdio:
#          servers-configuration: classpath:mcp-servers-config.json
        streamable-http:
          connections:
#            mcp-server:
#              url: http://localhost:8090
#              endpoint: /mcp
            mcp-search:
              url: ${MCP_SEARCH_URL:https://mcp-search.klasawchmurze.pl}
              endpoint: /mcp
    vectorstore:
      observations:
        log-query-response: true
      pgvector:
        # dimensions: ${LLM_EMBED_DIM:768}
        # nomic-embed-text  -> 768
        # bge-m3            -> 1024
        # text-embedding-3-small (OpenAI) -> 1536
        initialize-schema: true
        # index-type: HNSW
        # distance-type: COSINE_DISTANCE

  datasource:
    url: jdbc:postgresql://localhost:5432/training
    username: admin
    password: admin
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  observations:
    key-values:
      application: springai
  tracing:
    sampling:
      probability: 1.0
  # eksport OTLP do kontenera grafana/otel-lgtm (docker-compose.yml)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    org.springframework.ai.tool.toolsearch: DEBUG
    pl.training.springai.advisor: DEBUG
    io.modelcontextprotocol: DEBUG
mcp-search:
  token: ${MCP_TOKEN}
