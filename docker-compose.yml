services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      - 'POSTGRES_DB=training'
      - 'POSTGRES_USER=admin'
      - 'POSTGRES_PASSWORD=admin'
    ports:
      - '5432:5432'

  # Grafana (3000) + Prometheus + Tempo + Loki z wejsciem OTLP (4317 gRPC, 4318 HTTP)
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/spring-ai.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/spring-ai-dashboards:ro
